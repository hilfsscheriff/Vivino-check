[project]
name = "wine-check"
version = "0.1.0"
description = "Aktions- und Sale-Seiten der grössten Schweizer Weinhändler einlesen, gegen externe Bewertungen abgleichen, Preis-Leistung händlerübergreifend ranken."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "rapidfuzz>=3.9",
    "pdfplumber>=0.11",
    "reportlab>=4.2",
    "typer>=0.12",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
]

[project.scripts]
wine-check = "winecheck.cli:app"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winecheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
