# Wöchentlicher Lauf: Aktionen holen, bewerten, Seite bauen und einchecken.
#
# Läuft auf GitHub, nicht auf einem Rechner zu Hause — der Freitagslauf kommt also
# auch dann, wenn der Laptop zu ist.
#
# Der Push auf docs/ löst pages.yml aus, das die Seite ausliefert. Zwei Workflows
# statt einem, weil sie verschiedene Aufgaben haben: dieser sammelt Daten (35 Minuten,
# hunderte Netzanfragen), jener liefert aus (20 Sekunden). Wer nur die Seite neu
# ausliefern will, soll dafür keine 600 Vivino-Abfragen auslösen.
name: Wochenlauf

on:
  schedule:
    # Freitag 12:00 UTC = 14:00 Sommerzeit in der Schweiz — bewusst **nach** dem
    # Mac-Lauf um 07:00. Der trägt die Bewertungen in state/ratings-cache.json ein;
    # dieser Lauf holt sie sich von dort, weil er Vivino nicht selbst fragen kann.
    # Umgekehrte Reihenfolge hiesse: mit den Noten der Vorwoche arbeiten.
    #
    # Lief der Mac am Freitag nicht (ausgeschaltet), aktualisiert dieser Lauf
    # wenigstens die Preise. Genau dafür ist er da.
    - cron: "0 12 * * 5"
  workflow_dispatch:

# Nur ein Lauf gleichzeitig. Zwei parallele Läufe würden sich beim Commit in die
# Quere kommen und den Angebots-Cache widersprüchlich füllen.
concurrency:
  group: wochenlauf
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lauf:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: uv einrichten
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python und Abhängigkeiten
        run: uv sync --frozen

      # Der sqlite-Cache liegt nicht im Repo (binär, ändert sich bei jedem Lauf).
      # Ohne ihn würde jeder Freitag alle 600 Weine neu bei Vivino abfragen, obwohl
      # Bewertungen 90 Tage gelten — und diff.md hätte keinen Vergleichsstand, könnte
      # also nie sagen, was neu ist. Darum über den Actions-Cache mitnehmen.
      - name: Cache vom letzten Lauf holen
        uses: actions/cache@v4
        with:
          path: cache
          key: winecheck-cache-${{ github.run_id }}
          restore-keys: |
            winecheck-cache-

      - name: Aktionen holen
        run: uv run wine-check fetch --refresh-prices

      # Die Bewertungen kommen aus der Datei, die der lokale Freitagslauf einträgt.
      # Selbst nachfragen kann dieser Lauf nicht: Vivino sperrt Rechenzentrums-IPs,
      # ein Testlauf bekam für 465 von 478 Weinen ein "blocked".
      - name: Bewertungen einspielen
        run: uv run wine-check ratings-import

      # Trotzdem abgleichen: Weine, die schon eine Note im Cache haben, bekommen sie
      # sofort; für neue wird Vivino gefragt und im Zweifel geblockt. Das ist in
      # Ordnung — sie stehen dann ohne Note da, bis der lokale Lauf sie nachträgt.
      - name: Bewertungen zuordnen
        run: uv run wine-check rate

      - name: Report und Seite bauen
        run: |
          uv run wine-check report --out ./output
          uv run wine-check site --out ./docs

      # Reissleine. Der erste automatische Lauf holte die Preise fehlerfrei, bekam
      # aber nach 13 Vivino-Abfragen für 465 von 478 Weinen ein "blocked" — Vivino
      # sperrt Rechenzentrums-IPs. Eingecheckt worden wären 5 statt 174 bewertete
      # Weine. Ausgeliefert wurde es nur deshalb nicht, weil Pushes mit dem
      # Standard-Token keine weiteren Workflows auslösen; darauf darf man sich nicht
      # verlassen. Ein Lauf, der die Datenlage verschlechtert, bricht ab.
      # Reissleine gegen den ausgelieferten Stand. Der erste automatische Lauf holte
      # die Preise fehlerfrei, bekam aber nach 13 Vivino-Abfragen für 465 von 478
      # Weinen ein "blocked" — Vivino sperrt Rechenzentrums-IPs. Eingecheckt worden
      # wären 5 statt 174 bewertete Weine.
      #
      # Die Schwellen selbst stehen nicht mehr hier, sondern in
      # winecheck.aggregate.pruefe_plausibilitaet, und "report" bricht von sich aus ab.
      # Vorher gab es sie nur an dieser Stelle, während veröffentlicht wird: lokal
      # rate, report, site, git push — ohne jede Prüfung. Eine Regel für beide Wege.
      #
      # Hier bleibt nur der Vergleich gegen die *ausgelieferte* Seite, den nur CI
      # anstellen kann: lokal ist der Vorstand der Cache-Schnappschuss, hier ist es
      # docs/index.html aus HEAD.
      - name: Datenlage gegen den ausgelieferten Stand prüfen
        run: |
          uv run python - <<'PY'
          import csv, subprocess, sys

          from winecheck.aggregate import (
              MAX_BLOCKIERT_ANTEIL, MIN_BEWERTET_ANTEIL, MIN_VERGLEICHSBASIS,
          )

          rows = list(csv.DictReader(open("output/results.csv", encoding="utf-8-sig"),
                                     delimiter=";"))
          bew = sum(1 for r in rows if r.get("vivino_rating"))
          blockiert = sum(1 for r in rows if r.get("vivino_status") == "blocked")

          alt = subprocess.run(["git", "show", "HEAD:docs/index.html"],
                               capture_output=True, text=True).stdout
          alt_bew = alt.count('"r":')
          print(f"{len(rows)} Weine, {bew} bewertet, {blockiert} blockiert "
                f"| bisher ausgeliefert: {alt_bew} bewertet")

          if blockiert > len(rows) * MAX_BLOCKIERT_ANTEIL:
              sys.exit(f"Abbruch: {blockiert} von {len(rows)} Weinen blockiert. "
                       "Der alte Stand bleibt stehen.")

          if alt_bew >= MIN_VERGLEICHSBASIS and bew < alt_bew * MIN_BEWERTET_ANTEIL:
              sys.exit(f"Abbruch: nur {bew} bewertete Weine gegenüber {alt_bew} bisher. "
                       "Der alte Stand bleibt stehen.")
          PY

      # Zusammenfassung ins Actions-Protokoll, damit man ohne Download sieht, was
      # herauskam — und ob eine Quelle stillschweigend nichts mehr liefert.
      - name: Zusammenfassung
        run: |
          {
            echo "## Wochenlauf $(date -u +%d.%m.%Y)"
            echo
            uv run python - <<'PY'
          import csv, collections
          rows = list(csv.DictReader(open("output/results.csv", encoding="utf-8-sig"), delimiter=";"))
          bew = sum(1 for r in rows if r["vivino_rating"])
          print(f"**{len(rows)} Weine**, {bew} mit Vivino-Note ({bew*100//max(len(rows),1)} %)\n")
          print("| Händler | günstigste Positionen |")
          print("|---|---|")
          for k, v in collections.Counter(r["cheapest_retailer"] for r in rows).most_common():
              print(f"| {k or '—'} | {v} |")
          PY
            echo
            echo "### Änderungen"
            sed -n '1,40p' output/diff.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Einchecken
        run: |
          git config user.name "wine-check"
          git config user.email "noreply@github.com"
          git add docs
          # Ohne Änderung kein Commit — sonst wächst die Historie mit leeren Läufen,
          # und pages.yml würde jede Woche unnötig ausliefern.
          if git diff --cached --quiet; then
            echo "Keine Änderung an der Seite — nichts einzuchecken."
          else
            git commit -m "Wochenlauf $(date -u +%d.%m.%Y)"
            # Vor dem Schieben neu aufsetzen. Zwischen dem Auschecken und hier
            # liegen rund dreissig Minuten Rechenzeit, und wer in dieser Zeit von
            # Hand pusht, lässt den Lauf scheitern: "! [rejected] main -> main
            # (fetch first)". Genau daran ist der Lauf vom 14.08. gestorben,
            # nachdem er sauber durchgerechnet hatte.
            #
            # Rebase statt Merge, weil dieser Lauf nur docs/ anfasst und niemand
            # sonst diese Dateien schreibt — es gibt nichts zusammenzuführen, nur
            # eine Reihenfolge herzustellen.
            for versuch in 1 2 3; do
              git pull --rebase --quiet origin main && git push && break
              echo "Push-Versuch $versuch fehlgeschlagen — neu aufsetzen und nochmal"
              sleep 5
            done
          fi
