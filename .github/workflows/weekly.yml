# Wöchentlicher Lauf: Aktionen holen, bewerten, Seite bauen und einchecken.
#
# Läuft auf GitHub, nicht auf einem Rechner zu Hause — der Freitagslauf kommt also
# auch dann, wenn der Laptop zu ist.
#
# Der Push auf docs/ löst pages.yml aus, das die Seite ausliefert. Zwei Workflows
# statt einem, weil sie verschiedene Aufgaben haben: dieser sammelt Daten (35 Minuten,
# hunderte Netzanfragen), jener liefert aus (20 Sekunden). Wer nur die Seite neu
# ausliefern will, soll dafür keine 600 Vivino-Abfragen auslösen.
name: Wochenlauf

on:
  schedule:
    # Freitag 05:00 UTC = 07:00 Sommerzeit / 06:00 Winterzeit in der Schweiz.
    # GitHub kennt nur UTC; die Stunde wandert also über den Winter, was hier
    # niemanden stört. GitHub verschiebt geplante Läufe bei Last um bis zu einer
    # Stunde — die Uhrzeit ist ein Wunsch, keine Zusage.
    - cron: "0 5 * * 5"
  workflow_dispatch:

# Nur ein Lauf gleichzeitig. Zwei parallele Läufe würden sich beim Commit in die
# Quere kommen und den Angebots-Cache widersprüchlich füllen.
concurrency:
  group: wochenlauf
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lauf:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: uv einrichten
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python und Abhängigkeiten
        run: uv sync --frozen

      # Der sqlite-Cache liegt nicht im Repo (binär, ändert sich bei jedem Lauf).
      # Ohne ihn würde jeder Freitag alle 600 Weine neu bei Vivino abfragen, obwohl
      # Bewertungen 90 Tage gelten — und diff.md hätte keinen Vergleichsstand, könnte
      # also nie sagen, was neu ist. Darum über den Actions-Cache mitnehmen.
      - name: Cache vom letzten Lauf holen
        uses: actions/cache@v4
        with:
          path: cache
          key: winecheck-cache-${{ github.run_id }}
          restore-keys: |
            winecheck-cache-

      - name: Aktionen holen
        run: uv run wine-check fetch --refresh-prices

      - name: Bewertungen abgleichen
        run: uv run wine-check rate

      - name: Report und Seite bauen
        run: |
          uv run wine-check report --out ./output
          uv run wine-check site --out ./docs

      # Zusammenfassung ins Actions-Protokoll, damit man ohne Download sieht, was
      # herauskam — und ob eine Quelle stillschweigend nichts mehr liefert.
      - name: Zusammenfassung
        run: |
          {
            echo "## Wochenlauf $(date -u +%d.%m.%Y)"
            echo
            uv run python - <<'PY'
          import csv, collections
          rows = list(csv.DictReader(open("output/results.csv", encoding="utf-8-sig"), delimiter=";"))
          bew = sum(1 for r in rows if r["vivino_rating"])
          print(f"**{len(rows)} Weine**, {bew} mit Vivino-Note ({bew*100//max(len(rows),1)} %)\n")
          print("| Händler | günstigste Positionen |")
          print("|---|---|")
          for k, v in collections.Counter(r["cheapest_retailer"] for r in rows).most_common():
              print(f"| {k or '—'} | {v} |")
          PY
            echo
            echo "### Änderungen"
            sed -n '1,40p' output/diff.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Einchecken
        run: |
          git config user.name "wine-check"
          git config user.email "noreply@github.com"
          git add docs
          # Ohne Änderung kein Commit — sonst wächst die Historie mit leeren Läufen,
          # und pages.yml würde jede Woche unnötig ausliefern.
          if git diff --cached --quiet; then
            echo "Keine Änderung an der Seite — nichts einzuchecken."
          else
            git commit -m "Wochenlauf $(date -u +%d.%m.%Y)"
            git push
          fi
