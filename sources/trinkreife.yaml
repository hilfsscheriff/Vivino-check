  page: https://www.moevenpick-wein.com/de/magazin/weinwissen/wein-trinkreife-2026
  fetched_at: '2026-08-06'
  note: Jahrgangstabelle von Vinum, als Text-PDF veröffentlicht. Wird jährlich ersetzt — mit 'wine-check
    trinkreife' neu einlesen. Weinart stammt aus der Farbe des Weinglas-Symbols, Jahrgangsqualität aus
    der Zellhintergrundfarbe, leere Zellen bedeuten 'hätte man besser schon getrunken'.
legend:
  g: zu jung — reifen lassen
  k: macht Spass, wird noch besser
  '*': zurzeit höchster Genuss
  m: Zenit überschritten — austrinken
  '-': hätte man besser schon getrunken
