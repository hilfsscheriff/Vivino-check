# Geprüfte Zuordnungen, wo Vivinos Suche den richtigen Wein nicht hergibt.
#
# WOZU
# Vivinos Suchindex hat Löcher. Das ist im Adapter vermerkt: „Fallet Dart Champagne
# Brut Cuvée de Réserve" hat 533 Bewertungen und ist über keine Schreibweise zu
# finden — dafür gibt es den Rückfall über die Weingutseite. Manchmal reicht auch der
# nicht. Dann bleiben zwei Möglichkeiten: eine Note vom falschen Wein, oder eine
# nachgeprüfte Eintragung hier.
#
# WAS EIN EINTRAG BELEGEN MUSS
# Ein übereinstimmender **Name** genügt nicht. Vivino enthält Dubletten: von Nutzern
# angelegte Stummel, die wie der gesuchte Wein heissen, aber keine Bewertungen, einen
# einzigen Jahrgang und lückenhafte Angaben tragen — und nicht im Sortiment des Guts
# stehen. Wer einen solchen Stummel für den „richtigen" Eintrag hält, entfernt eine
# korrekte Note.
#
# Darum verlangt jeder Eintrag den Vergleich der **Substanz**:
#   * Rebsorten und Appellation gegen die Angaben des Händlers
#   * Zahl der Jahrgänge und der Bewertungen
#   * steht der Eintrag im Sortiment auf der Weingutseite?
# Dazu Adresse und Prüfdatum. Eine Beobachtung darf hier stehen, eine Vermutung nicht.
#
# FORMEN
#   ohne_note: true   Der richtige Wein ist bei Vivino geführt, trägt aber keine
#                     verwertbare Note. Dann gibt es hier keine — und die Adresse
#                     steht daneben, damit man selbst nachsehen kann.
version: 1

# ---------------------------------------------------------------------------
# ABGELEHNT — als Warnung stehengelassen, nicht als Eintrag.
#
# „Rocca di Frassinello la Rocca Maremma Toscana DOC" (Caratello, CHF 37.50) stand
# hier am 21.08.2026 mit `ohne_note: true` und der Adresse /w/14033263. Das war
# falsch, und der Fehler ist lehrreich:
#
#   Caratello nennt Sangiovese, Cabernet Sauvignon, Merlot.
#   /w/11745  „Rocca di Frassinello Maremma Toscana": Cabernet Sauvignon, Merlot,
#             Sangiovese — dieselbe Cuvée, dieselbe Appellation, 4663 Bewertungen,
#             viele Jahrgänge, im Sortiment der Weingutseite. Das IST der Wein.
#   /w/14033263 „La Rocca Maremma Toscana": nur Sangiovese, 0 Bewertungen, ein
#             Jahrgang, nicht im Sortiment. Ein Dublettenstummel.
#
# Eingetragen wurde er, weil sein **Name** zum Händlernamen passte — genau die
# Fehlerart, gegen die der Abgleich an vier Stellen abgesichert ist. Die Eintragung
# hat eine richtige Note (4.2) entfernt.
#
# Daraus die Regel oben: Substanz vergleichen, nicht Namen.
# ---------------------------------------------------------------------------

zuordnungen:
  - name: Toro Pintia Parker 94, DO 2020 Vega Sicilia
    url: https://www.vivino.com/de/w/77172
    geprueft_am: "2026-09-01"
    grund: >
      Gemeldet mit der Frage, weshalb der Wein nicht gefunden wurde. Er ist bei Vivino
      geführt — /w/77172 "Pintia Toro", Jahrgang 2020 mit 4.5 aus 2111 Bewertungen —,
      aber über Aligros Namen nicht erreichbar. Zwei Regeln löschen zusammen genau die
      Wörter, die ihn finden würden: "sicilia" fällt als italienische Region weg,
      obwohl es hier die zweite Hälfte des Produzenten *Vega Sicilia* ist, und "toro"
      fällt ebenfalls als Region weg, obwohl es bei Vivino der Weinname dieses
      Eintrags ist. Übrig bleibt die Abfrage "pintia vega" — und Vivino sucht mit
      UND-Verknüpfung, also liefert sie null Treffer, weil der Eintrag "vega" nirgends
      trägt (das Weingut heisst dort "Pintia"). "pintia" allein liefert ihn an erster
      Stelle, "pintia toro" ebenso; beides direkt an der Schnittstelle geprüft.
      Substanz: Weingut Pintia mit der Weingutsgruppe "Tempos Vega Sicilia"
      (vega-sicilia.com), Appellation Toro, Tempranillo — das ist Tinta de Toro. Damit
      stimmen Produzentengruppe, Appellation, Weinname und Jahrgang mit Aligros
      Angabe überein.
      Ein allgemeiner Rückfall auf weniger Suchwörter wurde gemessen und verworfen:
      bei 10 von 1073 kürzbaren Abfragen ergab er 0 brauchbare Treffer und 9 vom
      Abgleich verworfene Kandidatenlisten, bei rund 90 Minuten Zusatzlast je Lauf.
      Beim Pintia trägt das Kürzen nur, weil "pintia" ein seltener Eigenname ist — und
      das lässt sich vorab nicht wissen.

