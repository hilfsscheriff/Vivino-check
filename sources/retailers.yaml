    shop_root: https://www.aktionis.ch/
    promo_keywords: [wein, deals, aktion]
    verified_at: "2026-08-06"
    notes: >
      Aggregator, kein eigener Händler. Sammelt die Aktionen der Detailhändler ein und
      liefert sie serverseitig gerendert: /q/Wein, 48 Karten pro Seite, weiter über
      ?page=N (?p= und ?offset= werden ignoriert). Beim ersten Lauf 253 Weinangebote
      über 6 Seiten, verteilt auf Coop 204, Otto's 17, Denner 16, Lidl 7,
      Coop Megastore 5, SPAR 3, Volg 1.
      Damit kommen Quellen ins Werkzeug, die direkt nicht einlesbar sind (Coop,
      Migros, Lidl) oder für die es keinen eigenen Adapter gibt (Otto's, SPAR, Volg).
      Die Angebote werden dem *echten* Händler zugeschrieben, nicht Aktionis.
      ACHTUNG: Daten aus zweiter Hand. Ein Preis, der bei Aktionis falsch steht, steht
      danach auch im Report. Die Deal-URL wird als Angebots-URL mitgeführt, damit jede
      Zeile bis zur Quelle zurückverfolgbar bleibt.
      robots.txt erlaubt /q/ und /deals/; gesperrt sind /admin, /login, /profile,
      *.pdf, /dealtarget/ und /app — die werden nicht angefasst.
    private_label_brands:
      [Prix Garantie, Qualité & Prix, Fine Food, M-Classic, Sélection, Terra Vigneto,
       Carmelin, Domherrenwein, Heldenrosé, Noirillon, Cépage Roi]

