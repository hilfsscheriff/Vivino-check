# ------------------------------------------------------------------ Bewertungsquellen
rating_sources:
  - key: falstaff
    name: Falstaff
    role: leitquelle
    scale_max: 100
    domain: falstaff.com
    enabled: false
    status: blocked
    blocked_by: cloudflare
    urls:
      - https://www.falstaff.com/de
    verified_at: "2026-08-05"
    notes: >
      Als Leitquelle fürs Ranking vorgesehen, aber die gesamte Domain antwortet auf
      Anfragen ohne Browser-Fingerprint mit HTTP 403 ("Attention Required |
      Cloudflare") — Startseite, Wine-Guide und sogar die in robots.txt selbst
      angekündigte sitemap.xml. Das ist eine Firewall-Regel, keine JS-Challenge;
      andere Header helfen nicht. falstaff.ch leitet per 301 auf falstaff.com.
      Der Adapter ist gebaut und liefert Status 'blocked' mit Retry-Zeitpunkt,
      sodass er ohne Codeänderung wieder greift, sobald Zugang besteht.

  - key: vivino
    name: Vivino
    role: pflichtspalte
    scale_max: 5
    domain: vivino.com
    enabled: true
    status: ok
    api: https://www.vivino.com/api/explore/explore
    search_url: https://www.vivino.com/de/explore?search_term=
    verified_at: "2026-08-05"
    notes: >
      Wird für JEDEN Wein abgefragt, unabhängig von Falstaff, und erscheint immer im
      Output. Die Weinseiten-HTML lädt die Note per JavaScript nach (daher der
      Status rating_not_readable), der JSON-Endpunkt /api/explore/explore liefert sie
      dagegen strukturiert: Jahrgangs- und Weinschnitt getrennt, mit Anzahl
      Bewertungen. robots.txt verbietet /ajax/, /prices/ und /reviews/ — /api/ und
      die Weinseiten selbst sind erlaubt. Pflichtparameter: search_term plus
      mindestens ein Filter.

