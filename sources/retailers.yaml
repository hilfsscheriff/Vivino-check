    verified_at: "2026-08-05"
    login:
      env_user: PRODEGA_USER
      env_pass: PRODEGA_PASS
      env_cookie: PRODEGA_COOKIE
    market: null                 # prodega_market — Heimmarkt hier eintragen
    # Prodega quotiert exkl. MwSt und meist pro Karton. Beides muss gesetzt sein,
    # sonst ist der Vergleich mit Coop/Denner falsch.
    vat_included: false
    price_basis: pack
    notes: >
      31 Märkte, grösster Cash+Carry der Schweiz, Teil der Coop-Gruppe. Nicht
      prodega.ch, sondern transgourmet.ch. Produktekatalog hinter Login.
      Sortiment ist marktspezifisch — 'market' setzen.
      robots.txt der Domain verbietet /login und /search/ für Crawler; der Adapter
      behandelt den Login als Nutzeraktion mit eigenen Zugangsdaten, nicht als
      Crawling, und hält auch dort das Rate-Limit ein. Details im README.
    private_label_brands: [Economy, Quality, Premium, Natura, Origine, Transgourmet]

