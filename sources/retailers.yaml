# Quellen-Registry. Neue Händler können hier ohne Codeänderung ergänzt werden.
#
# status-Werte, gesetzt beim ersten verifizierten Lauf (05.08.2026):
#   ok              Aktionsseite mit httpx erreichbar, Adapter vorhanden
#   blocked         Bot-Schutz (Cloudflare/DataDome). Wird NICHT umgangen.
#   url_unverified  Deep-Link antwortete 404, Promo-Kategorie muss vom Shop-Root
#                   aus gesucht werden (resolve_url macht das und protokolliert es)
#   login_required  Katalog liegt hinter Login, Zugangsdaten aus .env
#   no_adapter      Quelle erreichbar, Adapter noch nicht gebaut
version: 1

defaults:
  rate_limit_seconds: 2.0      # max 1 Anfrage pro 2 s pro Domain
  respect_robots: true
  vat_included: true           # Detailhandel schreibt inkl. MwSt an
  price_basis: auto           # aus dem Text ableiten (Karton vs. Flasche); Prodega überschreibt mit "pack"
  timeout_seconds: 30.0

retailers:
  # ---------------------------------------------------------------- Tier 1
  - key: coop
    name: Coop
    channel: Filiale und Onlineshop
    tier: 1
    domain: coop.ch
    adapter: coop
    enabled: false
    status: blocked
    urls:
      - https://www.coop.ch/de/aktionen/aktuelle-aktionen/aktionen-weine/c/m_1808
    verified_at: "2026-08-05"
    blocked_by: datadome
    notes: >
      Marktführer, regelmässige 20%-Weinwochen. Die vom Auftrag genannte URL ist
      korrekt und im Browser erreichbar, antwortet aber auf jede Anfrage ohne
      Browser-Fingerprint mit HTTP 403 und einer DataDome-CAPTCHA-Seite — sogar
      /robots.txt selbst. Ohne Browser-Automation nicht einlesbar. Der Adapter ist
      vorhanden und meldet 'blocked' statt zu scheitern.
    private_label_brands: [Coop, Prix Garantie, Qualité & Prix, Fine Food]

  - key: denner
    name: Denner
    channel: Filiale und Onlineshop
    tier: 1
    domain: denner.ch
    adapter: denner
    enabled: true
    status: ok
    urls:
      - https://www.denner.ch/de/weinshop/wein-aktionen
      - https://www.denner.ch/de/weinshop/wein-sortiment
      - https://www.denner.ch/de/aktionen/aktuelle-aktionen
      - https://www.denner.ch/de/aktionen/aktionen-ab-donnerstag
    shop_root: https://www.denner.ch/de/
    promo_keywords: [wein-aktionen, aktion, aktionen, angebot, sale, rabatt, weinshop]
    verified_at: "2026-08-05"
    notes: >
      Nr. 2, Migros-Tochter. /de/shop/wein/ aus dem Auftrag leitet per 301 auf
      /de/weinshop um, /de/aktionen auf /de/aktuelle-aktionen — beide aufgelöste
      Adressen sind oben eingetragen. Nuxt-Anwendung, Daten liegen als
      __NUXT_DATA__ im HTML.
      Die allgemeine Aktionsseite führt meist nur einen einzelnen Wein; die
      eigentliche Weinliste steht unter /de/weinshop/wein-aktionen. Beide werden
      geholt, /de/weinshop selbst enthält nur Bannertexte ohne Preise.
    private_label_brands:
      [Carmelin, Domherrenwein, Heldenrosé, Heldenrose, Noirillon, Cépage Roi,
       Sélection, Bergkristall]

