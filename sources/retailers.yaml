  # ---------------------------------------------------------------- Tier 2
  - key: flaschenpost
    name: Flaschenpost
    channel: Onlineshop, Lieferung
    tier: 2
    domain: flaschenpost.ch
    adapter: flaschenpost
    enabled: true
    status: delisted_only
    urls: []
    vat_included: true
    price_basis: bottle
    private_label_brands: []
    wine_only: true
    # Absichtlich nicht "blocked": dieser Wert heisst in diesem Projekt "Schutz
    # wird nicht umgangen", und das trifft hier nicht zu. Der Zugriff ist frei —
    # /api/products antwortet jedem mit HTTP 200, geprüft mit ehrlichem
    # Projekt-User-Agent, ganz ohne und als Chrome, alle drei byteidentisch.
    #
    # Unbrauchbar ist nicht der Zugang, sondern der Inhalt: die Schnittstelle führt
    # ausschliesslich ausgelistete Ware. Über 6000 geprüfte Produkte war keines
    # published, keines active, keines lieferbar; 20 stichprobenweise geöffnete
    # Produktseiten antworteten alle mit 404, während ein Wein von der
    # Kategorieseite des Ladens 200 lieferte. Die 476 "Aktionen" waren Phantome
    # mit toten Links und Preisen von gestern.
    #
    # "blocked" bliebe der Eintrag für immer, weil dann gar nicht mehr abgefragt
    # wird. Mit diesem Wert läuft der Adapter weiter, prüft drei Seiten und meldet
    # sich blockiert — und füllt sich von selbst wieder, falls der Laden den Pfad
    # je auf lebendes Sortiment umstellt.
    note: >
      Grösster Online-Weinhändler CH, derzeit ohne verwertbare Daten. Die offene
      Produkt-API liefert nur ausgelistete Ware (published=false, active=false,
      Produktseiten 404), die Webseite selbst liegt hinter Cloudflare. Der Adapter
      prüft wöchentlich drei Seiten nach und meldet blockiert. Details im Kopf von
      adapters/flaschenpost.py.
    verified_at: "2026-08-15"

