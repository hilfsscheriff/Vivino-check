      ein Soft-404: schuler.ch gibt fuer unbekannte Pfade die ganze Seite mit 946 kB
      aus, weshalb ein Statuscode-Test dort nichts aussagt. Die Aktionsrubrik heisst
      restpostenweine.
      Keine Blaetterung: robots.txt der Domain verbietet Query-Strings, und ?p=2
      faellt darunter. Wir nehmen die erste Seite und weisen das aus, statt die
      Regel zu biegen.
      und Denz.

