    price_basis: bottle
    wine_only: true
    private_label_brands: []
    verified_at: "2026-08-10"
    notes: >
      Laeuft auf Shopware - die Sitemap heisst salesChannel-018b..., und die
      Selektoren des Shopware-Adapters greifen unveraendert (product-box,
